[package]
name = "rustverse_svg"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
minijinja = "2.21.0"
nanoka = { path = "../nanoka", default-features = false }
glyphon = "=0.12.0"
png = "=0.18.1"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
resvg = { version = "0.47.0", default-features = false, features = ["raster-images", "text"] }
rustverse = { version = "0.1.0", path = "../rustverse" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync"] }
wgpu = "=30.0.0"

[features]
render-season = []

[[example]]
name = "render_season"
required-features = ["render-season"]
