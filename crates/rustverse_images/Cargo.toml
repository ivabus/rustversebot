[package]
name = "rustverse_images"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
nanoka = { path = "../nanoka", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustverse = { version = "0.1.0", path = "../rustverse" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "process", "time"] }

[features]
render-season = []

[[example]]
name = "render_season"
required-features = ["render-season"]
