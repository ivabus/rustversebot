[package]
name = "rustverse_ai"
version = "0.1.0"
edition = "2024"
description = "Russian analysis of bilingual GachaBase agent diffs using OpenAI"

[[bin]]
name = "rustverse-ai"
path = "src/main.rs"

[dependencies]
nanoka = { path = "../nanoka", default-features = false }
chrono = "0.4"
anyhow = "1"
base64 = "0.22"
md5 = "0.7"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
rhai = { version = "1.27", features = ["no_module", "no_function", "no_custom_syntax", "no_optimize", "no_time"] }
rig-core = { version = "0.47", default-features = false }
rig-agent = { version = "0.47", default-features = false }
rig-reqwest = { version = "0.47", default-features = false, features = ["native-tls"] }
log = "0.4"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
# The blocking exporter runs on the SDK's batch worker and shares Rig's reqwest native TLS.
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "internal-logs"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
async-trait = "0.1"
futures-util = "0.3"
opentelemetry-http = "0.33"
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["testing"] }
