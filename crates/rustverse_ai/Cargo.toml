[package]
name = "rustverse_ai"
version = "0.1.0"
edition = "2024"
description = "Russian analysis of bilingual GachaBase agent diffs using OpenAI"

[[bin]]
name = "rustverse-ai"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
