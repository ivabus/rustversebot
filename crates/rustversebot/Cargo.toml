[package]
name = "rustversebot"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
# Match teloxide 0.13 so uploads reuse its configured Bot API client.
telegram-http = { package = "reqwest", version = "0.11", default-features = false, features = ["multipart"] }
rustverse = { path = "../rustverse" }
nanoka = { path = "../nanoka", default-features = false }
teloxide = { version = "0.13", features = ["macros", "ctrlc_handler"] }
tokio = { version = "1", features = ["full"] }
minijinja = "2"
pulldown-cmark = { version = "0.13", default-features = false }
libsql = { version = "0.9", default-features = false, features = ["core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = { version = "0.29", default-features = false }
axum = "0.8"
log = "0.4"
env_logger = "0.11"
url = "2"
rustverse_images = { version = "0.1.0", path = "../rustverse_images" }
rustverse_ai = { path = "../rustverse_ai" }

[dev-dependencies]
tempfile = "3"
tower = "0.5"
