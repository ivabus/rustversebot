[package]
name = "rustversebot"
version = "0.1.0"
edition = "2024"

[dependencies]
rustverse = { path = "../rustverse" }
nanoka = { path = "../nanoka", default-features = false }
teloxide = { version = "0.13", features = ["macros", "ctrlc_handler"] }
tokio = { version = "1", features = ["full"] }
minijinja = "2"
libsql = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
anyhow = "1"
axum = "0.8"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
url = "2"
rustverse_svg = { version = "0.1.0", path = "../rustverse_svg" }

[dev-dependencies]
tower = "0.5"
