<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Предпросмотр /betadiff</title>
<style>
  :root { color-scheme: dark; background: #171717; }
  body { margin: 0; }
  img { display: block; margin: auto; width: min(100%, 800px); height: auto; }
</style>
<img alt="Страница бета-диффа появится после рендера">
<script>
  const page = document.querySelector("img");
  let revision;
  async function refresh() {
    try {
      const response = await fetch("page.png", {method: "HEAD"});
      const next = response.headers.get("X-Preview-Revision");
      if (response.ok && next && next !== revision) {
        revision = next;
        page.src = "page.png?v=" + next;
      }
    } finally {
      setTimeout(refresh, 750);
    }
  }
  refresh();
</script>
</html>
