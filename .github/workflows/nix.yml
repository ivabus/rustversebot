name: Nix build and Attic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and cache (aarch64-darwin)
    runs-on: macos-26
    environment: Actions
    env:
      ATTIC_CACHE: "rustversebot"
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Configure Attic cache
        env:
          ATTIC_SERVER: ${{ secrets.ATTIC_SERVER }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          : "${ATTIC_SERVER:?ATTIC_SERVER secret is required}"
          : "${ATTIC_TOKEN:?ATTIC_TOKEN secret is required}"
          nix run .#attic -- login github-actions "$ATTIC_SERVER" "$ATTIC_TOKEN"
          nix run .#attic -- use "$ATTIC_CACHE"
      - name: Build cached Cargo dependencies
        run: nix build .#cargoArtifacts --out-link result-deps --print-build-logs
      - name: Push Cargo dependency closure to Attic
        run: nix run .#attic -- push "$ATTIC_CACHE" ./result-deps
      - name: Build bot
        run: nix build .#rustversebot --print-build-logs
      - name: Push bot closure to Attic
        run: nix run .#attic -- push "$ATTIC_CACHE" ./result
