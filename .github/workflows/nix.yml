name: Nix build and Attic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and cache (aarch64-darwin)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Build bot
        run: nix build .#rustversebot --print-build-logs
      - name: Log in to Attic
        env:
          ATTIC_SERVER: ${{ secrets.ATTIC_SERVER }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: nix run .#attic -- login github-actions "$ATTIC_SERVER" "$ATTIC_TOKEN"
      - name: Push closure to Attic
        env:
          ATTIC_CACHE: ${{ secrets.ATTIC_CACHE }}
        run: nix run .#attic -- push "$ATTIC_CACHE" ./result
